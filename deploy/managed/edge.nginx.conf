user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  log_format sanitized '$remote_addr method=$request_method uri=$uri status=$status';
  access_log /dev/stdout sanitized;
  server {
    listen 19450 ssl;
    server_name mcp-service.midi.lizhijian.xyz;
    ssl_certificate /etc/letsencrypt/live/mcp-service.midi.lizhijian.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-service.midi.lizhijian.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location = / { return 302 /admin; }
    location / {
      proxy_pass http://127.0.0.1:18353;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 180s;
      proxy_connect_timeout 5s;
    }
  }
}
