location = / { return 302 /admin; }
location = /ui { return 302 /ui/home/; }
location ~ ^/(admin(?:/|$)|ui(?:/|$)|litellm-asset-prefix/|get_image$|get_favicon$|model-api/) {
    proxy_pass http://mediec_mcp_frp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host mediec-ai-gateway.internal;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Mediec-Public-Origin https://mcp-service.midi.lizhijian.xyz;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 8m;
    gzip off;
}
