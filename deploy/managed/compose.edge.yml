services:
  edge:
    image: sub2api-edge-runtime:20261019
    network_mode: host
    entrypoint: [nginx, -g, 'daemon off;']
    volumes:
      - ./edge.nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/mcp-service.midi.lizhijian.xyz:/etc/letsencrypt/live/mcp-service.midi.lizhijian.xyz:ro
      - /etc/letsencrypt/archive/mcp-service.midi.lizhijian.xyz:/etc/letsencrypt/archive/mcp-service.midi.lizhijian.xyz:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx:size=16m, /var/run:size=1m, /tmp:size=1m]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}
